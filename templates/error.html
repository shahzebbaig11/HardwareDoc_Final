{% extends "base.html" %}
{% block title %}{{ code }} Error{% endblock %}
{% block content %}
<div class="page-inner page-narrow">
  <div class="error-page">
    <div class="error-code" aria-hidden="true">{{ code }}</div>
    <h1 class="error-title">{{ "Page Not Found" if code == 404 else "Server Error" }}</h1>
    <p class="error-message">{{ message }}</p>
    <div class="error-actions">
      <a href="{{ url_for('home') }}" class="btn btn-primary" id="error-home-btn">← Go Home</a>
      <a href="{{ url_for('diagnosis_new') }}" class="btn btn-secondary" id="error-diag-btn">Start Diagnosis</a>
    </div>
  </div>
</div>
{% endblock %}
